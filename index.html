<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17221d">
  <meta name="description" content="Take a quiet canoe journey down Pinebend River, with moving water, forest birds and unhurried paddling.">
  <link rel="icon" href="/stillwater.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="/assets/pinebend.webp">
  <link rel="stylesheet" href="/src/style.css">
  <title>Stillwater — Pinebend River</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="mountains" viewBox="0 0 42 36"><path d="m2 20 10-15 7 10 6-12 15 17M8.5 10.5l3.7 2 2.7-2M21 10.5l4.6 2.3 2.5-3.5M2 24c7.5-4.4 13 4.3 20 0s11.5 3.4 18.3-1M2 30c7.5-4.4 13 4.3 20 0s11.5 3.4 18.3-1"/></symbol>
    <symbol id="sound" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4zM15.8 8a6 6 0 0 1 0 8M18.6 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="mute" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4zM16 9l5 6m0-6-5 6"/></symbol>
    <symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
    <symbol id="collapse" viewBox="0 0 24 24"><path d="M4 9h5V4m6 0v5h5M4 15h5v5m6 0v-5h5"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7.5 4.4a.8.8 0 0 1 1.2-.7l12 7.6a.8.8 0 0 1 0 1.4l-12 7.6a.8.8 0 0 1-1.2-.7z"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3"/></symbol>
    <symbol id="headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 12h3v8H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 1-2zM20 12h-3v8h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-1-2z"/></symbol>
    <symbol id="pine" viewBox="0 0 24 24"><path d="m12 2-6 8h3l-5 7h16l-5-7h3zM12 17v5"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><path d="M2 16h20M4 20h16M6 16a6 6 0 0 1 12 0M12 3v3M3.5 7.5l2 2m15-2-2 2M1 12l2.5.7m19-0.7-2.5.7"/></symbol>
    <symbol id="keyboard" viewBox="0 0 24 24"><rect x="1.5" y="5" width="21" height="14" rx="2"/><path d="M5 9h1m3 0h1m3 0h1m3 0h1M5 12h1m3 0h1m3 0h1m3 0h1M8 15h8"/></symbol>
    <symbol id="gamepad" viewBox="0 0 24 24"><path d="M7.5 6a6 6 0 0 0-5 5l-1 5c-.5 3.1 2.2 4.1 4.1 2.4l3-3h6.8l3 3c2 1.7 4.6.7 4.1-2.4l-1-5a6 6 0 0 0-5-5c-2 0-2.3.9-4.5.9S9.5 6 7.5 6zM7 9v5m-2.5-2.5h5m7-1.5h.1m2 2h.1"/></symbol>
    <symbol id="map-icon" viewBox="0 0 24 24"><path d="m2.5 5 6-2 7 3 6-2v15l-6 2-7-3-6 2zM8.5 3v15m7-12v15"/></symbol>
  </svg>
  <main id="experience" data-mode="arrival">
    <div id="world" aria-label="First-person canoeing on Pinebend River"></div>
    <div class="cover" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
    <header>
      <div class="brand"><svg aria-hidden="true"><use href="#mountains"/></svg><span>Stillwater</span></div>
      <div class="utilities">
        <button id="sound-toggle" class="glass sound-btn" aria-pressed="false" title="Mute or enable the soundscape"><svg><use href="#sound"/></svg><span>Sound on</span></button>
        <button id="fullscreen" class="glass round" aria-label="Enter fullscreen" title="Fullscreen"><svg><use href="#expand"/></svg></button>
        <button id="pause-btn" class="glass round" aria-label="Pause canoeing" title="Pause (Esc)" hidden><svg><use href="#pause"/></svg></button>
      </div>
    </header>
    <div class="arrival">
      <section class="river-intro" aria-labelledby="river-title">
        <div class="eyebrow"><span class="rule"></span>River environment <span class="num">01</span></div>
        <h1 id="river-title">Pinebend <em>River</em></h1>
        <p class="summary">An unhurried paddle through the northern pines.</p>
        <div class="traits"><span><svg><use href="#pine"/></svg>Alpine forest</span><i></i><span><svg><use href="#sun"/></svg>Early morning</span></div>
        <button id="enter" class="enter"><svg><use href="#play"/></svg><span>Begin canoeing</span></button>
        <div id="status" role="status"></div>
      </section>
      <aside class="map-card" aria-label="Map of the river near your canoe">
        <div class="map-head"><span><svg><use href="#map-icon"/></svg>River map</span><small>N <b>↑</b></small></div>
        <canvas id="chart" width="458" height="230" aria-label="Contour map showing your location on the river"></canvas>
        <div class="map-foot"><span class="locator"></span><span id="map-label">Launch point</span><i></i><span>01 / 01</span></div>
      </aside>
    </div>
    <footer>
      <div class="guide"><span class="guide-title">Paddling guide</span><div class="bindings"><span><svg><use href="#keyboard"/></svg>Keyboard</span><kbd>←</kbd><kbd>→</kbd></div><i></i><div class="bindings"><span><svg><use href="#gamepad"/></svg>Xbox</span><kbd>LT</kbd><kbd>RT</kbd></div></div>
      <div class="headphone"><svg><use href="#headphones"/></svg>Best with headphones</div>
    </footer>
    <div id="touch-controls" aria-label="Paddles" hidden><button class="glass" data-side="left">Left paddle</button><button class="glass" data-side="right">Right paddle</button></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
